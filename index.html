<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resala Mini</title>
<meta name="description" content="Resala Mini - follow us on Facebook, Instagram and TikTok.">
<meta property="og:title" content="Resala Mini">
<meta property="og:image" content="hero-stand.png">
<link rel="preload" as="image" href="hero-run.png">
<link rel="preload" as="image" href="hero-stand.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#d6102b; --blue:#0b4fb3; --navy:#0a1f4d; --yellow:#ffc21a; --bg:#ffffff; --ink:#0a1f4d;
  }
  @media (prefers-color-scheme: dark){
    /* images have white backgrounds, so keep the stage white and darken only the page frame */
    :root{ --frame:#0a1f4d; --frame-ink:#fff; }
  }
  :root{ --frame:#eef3fb; --frame-ink:var(--ink); }
  @media (prefers-color-scheme: dark){ :root{ --frame:#0a1f4d; --frame-ink:#fff; } }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:28px;
    padding:24px 16px; background:var(--frame); color:var(--frame-ink);
    font-family:"Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
    background-image:
      linear-gradient(var(--frame) 0 0);
  }

  .stage{
    position:relative; width:min(960px,100%); aspect-ratio:3/2;
    background:#fff; border:6px solid var(--navy); box-shadow:10px 10px 0 var(--blue);
    cursor:pointer; overflow:hidden; user-select:none; -webkit-tap-highlight-color:transparent;
    outline-offset:6px;
  }
  .stage:focus-visible{outline:4px solid var(--yellow)}
  .stage img{
    position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    image-rendering:pixelated; opacity:0; transition:opacity .5s steps(5);
  }
  .stage img.on{opacity:1}
  .stage.bob img.on{animation:bob 1.1s steps(2) infinite}
  @keyframes bob{ 50%{transform:translateY(-1.5%)} }
  .stage.hop img.on{animation:hop .45s steps(6)}
  @keyframes hop{ 40%{transform:translateY(-6%)} }

  .hint{
    position:absolute; left:10px; bottom:10px; font-size:9px; background:var(--navy); color:#fff;
    padding:6px 8px; opacity:.9;
  }

  h1{font-size:clamp(14px,3.2vw,22px); margin:0; text-align:center; line-height:1.5}
  h1 span{color:var(--red)}
  p.tag{font-size:clamp(9px,1.8vw,11px); line-height:1.9; margin:0; text-align:center; max-width:44ch}

  .social{display:flex; flex-wrap:wrap; gap:16px; justify-content:center; padding:0; margin:0; list-style:none}
  .social a{
    display:flex; align-items:center; gap:10px; padding:14px 18px; text-decoration:none;
    font-size:11px; color:#fff; border:4px solid var(--navy); background:var(--c);
    box-shadow:6px 6px 0 var(--navy); transition:transform .08s steps(2), box-shadow .08s steps(2);
  }
  .social a:hover,.social a:focus-visible{transform:translate(-3px,-3px); box-shadow:9px 9px 0 var(--navy); outline:none}
  .social a:focus-visible{border-color:var(--yellow)}
  .social a:active{transform:translate(6px,6px); box-shadow:0 0 0 var(--navy)}
  .social svg{width:22px;height:22px;fill:currentColor;flex:none}
  .fb{--c:#1565d8} .ig{--c:var(--red)} .tt{--c:#111827}
  .tt{color:var(--yellow)}

  footer{font-size:8px; opacity:.7}

  @media (prefers-reduced-motion: reduce){
    .stage img{transition:none}
    .stage.bob img.on,.stage.hop img.on{animation:none}
  }
</style>
</head>
<body>

<main class="stage bob" id="stage" tabindex="0" role="img" aria-label="Resala Mini mascot, click to make him jump">
  <img id="a" class="on" src="hero-stand.png" alt="Resala Mini mascot standing ready" width="1536" height="1024">
  <img id="b" src="hero-run.png" alt="Resala Mini mascot running" width="1536" height="1024">
  <span class="hint" id="hint">Tap me!</span>
</main>

<h1>Resala <span>Mini</span></h1>
<p class="tag">Join the run. Follow us and never miss a level.</p>

<!-- TODO: replace the three # links with your real pages -->
<ul class="social">
  <li><a class="fb" href="https://facebook.com/YOUR_PAGE" target="_blank" rel="noopener" aria-label="Resala Mini on Facebook">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 8h3V4h-3a4 4 0 0 0-4 4v2H7v4h3v8h4v-8h3l1-4h-4V8z"/></svg>Facebook</a></li>
  <li><a class="ig" href="https://instagram.com/YOUR_PAGE" target="_blank" rel="noopener" aria-label="Resala Mini on Instagram">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3.5a4.5 4.5 0 1 1 0 9 4.5 4.5 0 0 1 0-9zm0 2a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM17.5 6a1.2 1.2 0 1 1 0 2.400 1.200 1.200 0 0 1 0-2.400z"/></svg>Instagram</a></li>
  <li><a class="tt" href="https://tiktok.com/@YOUR_PAGE" target="_blank" rel="noopener" aria-label="Resala Mini on TikTok">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3c.3 2.400 1.800 4 4 4.200v3.200c-1.500 0-2.900-.5-4-1.300V15a6 6 0 1 1-6-6c.3 0 .7 0 1 .1v3.300a2.800 2.800 0 1 0 1.800 2.600V3H16z"/></svg>TikTok</a></li>
</ul>

<footer>&copy; <span id="yr"></span> Resala Mini</footer>

<script>
(function(){
  var stage=document.getElementById('stage'),
      imgs=[document.getElementById('a'),document.getElementById('b')],
      hint=document.getElementById('hint'),
      i=0, timer=null, DELAY=1800;

  document.getElementById('yr').textContent=new Date().getFullYear();

  function show(n){
    i=n; imgs.forEach(function(im,k){ im.classList.toggle('on',k===i); });
  }
  function next(){ show((i+1)%imgs.length); }
  function start(){ stop(); timer=setInterval(next,DELAY); }
  function stop(){ clearInterval(timer); timer=null; }

  // auto alternate, but only while the tab is visible (saves battery)
  start();
  document.addEventListener('visibilitychange',function(){ document.hidden?stop():start(); });

  // pause while hovering (desktop)
  stage.addEventListener('mouseenter',stop);
  stage.addEventListener('mouseleave',start);

  // click / tap / Enter / Space: swap pose + little hop
  function poke(){
    next(); start();
    hint.style.display='none';
    stage.classList.remove('hop'); void stage.offsetWidth; stage.classList.add('hop');
    setTimeout(function(){ stage.classList.remove('hop'); },460);
  }
  stage.addEventListener('click',poke);
  stage.addEventListener('keydown',function(e){
    if(e.key==='Enter'||e.key===' '){ e.preventDefault(); poke(); }
  });
})();
</script>
</body>
</html>
